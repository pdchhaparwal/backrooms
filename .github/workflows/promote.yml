# The deliberate step from staging to production: fast-forwards the `production`
# branch to `main` (or another ref). Render then deploys backrooms-production.
# Run it from the Actions tab -> "Promote to production" -> Run workflow.
name: Promote to production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or commit to release"
        required: false
        default: main

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fast-forward production
        env:
          REF: ${{ inputs.ref }}
        run: |
          target=$(git rev-parse --verify -q "origin/$REF" || git rev-parse --verify "$REF")
          if git rev-parse --verify -q origin/production >/dev/null; then
            git merge-base --is-ancestor origin/production "$target" \
              || { echo "production has commits that are not in $REF; refusing to overwrite"; exit 1; }
          fi
          git push origin "$target:refs/heads/production"
          echo "Promoted $(git log -1 --format='%h %s' "$target") to production" >> "$GITHUB_STEP_SUMMARY"
